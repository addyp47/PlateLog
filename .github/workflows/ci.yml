name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run unit and release checks
        run: npm test
      - name: Syntax check client modules and edge functions
        run: |
          node --check public/adapter.js
          node --check public/analytics.js
          node --check public/sw.js
          node --check public/config.example.js
          node --check public/vendor/barcode.mjs
          node --experimental-strip-types --check supabase/functions/api/index.ts
          node --experimental-strip-types --check supabase/functions/sample/index.ts
