name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify tests and tag matches package.json version
        run: |
          npm test
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VER"
            exit 1
          fi
      - name: Package static frontend
        run: zip -r platelog-public-${GITHUB_REF_NAME}.zip public
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: platelog-public-${{ github.ref_name }}.zip
